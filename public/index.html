<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Gestion des étudiants</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="app.js" defer></script>
</head>
<body>
    <h1>Gestion des étudiants</h1>

    <h2>Ajouter / Modifier un étudiant</h2>
    <form id="formEtudiant">
        <input type="hidden" id="id">
        <input type="text" id="nom" placeholder="Nom" required>
        <input type="email" id="email" placeholder="Email" required>
        <input type="number" id="age" placeholder="Âge" min="1" required>
        
        <button type="submit" id="btnEnregistrer">Ajouter</button>
        <button type="button" id="btnAnnuler" onclick="annulerModification()">
            Annuler
        </button>
    </form>

    <h2>Liste des étudiants</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nom</th>
                <th>Email</th>
                <th>Âge</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="listeEtudiants"></tbody>
    </table>
</body>
</html>
